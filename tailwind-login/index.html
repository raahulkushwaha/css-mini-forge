<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="./dist/output.css" />
  </head>
  <body class="bg-gray-950 flex justify-center items-center min-h-screen">
    <div class="bg-gray-700 rounded-xl p-8 shadow-2xl max-w-sm w-full">
      <h2 class="text-3xl text-center text-gray-300 font-bold mb-6">Login</h2>
      <form>
        <div class="mb-4">
          <label
            for="email"
            class="text-sm font-medium block text-gray-300 mb-2"
            >Email:</label
          ><input
            type="email"
            placeholder="enter email"
            class="w-full px-3 py-2 bg-gray-600 rounded-md text-white border-2 border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-600"
          />
        </div>
        <div class="mb-6">
          <label
            for="password"
            class="text-sm font-medium block text-gray-300 mb-2"
            >Password:</label
          ><input
            type="password"
            placeholder="enter password"
            class="w-full px-3 py-2 bg-gray-600 rounded-md text-white border-2 border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-600"
          />
        </div>
        <button
          class="w-full bg-blue-600 py-2 rounded-md text-gray-300 font-medium text-sm hover:bg-blue-700 shadow-blue-600"
        >
          Login
        </button>
      </form>
    </div>
  </body>
</html>
