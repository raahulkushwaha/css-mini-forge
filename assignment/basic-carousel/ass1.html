<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>carousel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="ass1.css" />
  </head>
  <body>
    <div class="main">
      <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Slide 1"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="1"
            aria-label="Slide 2"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="2"
            aria-label="Slide 3"
          ></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img
              src="https://images.pexels.com/photos/7775636/pexels-photo-7775636.jpeg"
              class="d-block w-100"
              alt="..."
            />
          </div>
          <div class="carousel-item">
            <img
              src="https://images.pexels.com/photos/5054776/pexels-photo-5054776.jpeg"
              class="d-block w-100"
              alt="..."
            />
          </div>
          <div class="carousel-item">
            <img
              src="https://images.pexels.com/photos/3532552/pexels-photo-3532552.jpeg"
              class="d-block w-100"
              alt="..."
            />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>

      <div class="videos">
        <div class="video">
          <img src="./src/vid1.png" alt="video 1" /><a
            class="btn btn-danger watch-button"
            href="https://youtu.be/6-Dsfgui0sE?si=DAZWA84ql4s7Zira"
            >Watch Now</a
          >
        </div>
        <div class="video">
          <img src="./src/vid2.png" alt="video 2" /><a
            class="btn btn-danger watch-button"
            href="https://youtu.be/Wh9yXS9sgio?si=0h4l_J8xesm5BCAw"
            >Watch Now</a
          >
        </div>
        <div class="video">
          <img src="./src/vid3.png" alt="video 3" /><a
            class="btn btn-danger watch-button"
            href="https://youtu.be/3OGrCtdnSFA?si=AghfGedOdMN5jvb-"
            >Watch Now</a
          >
        </div>
        <div class="video">
          <img src="./src/vid1.png" alt="video 1" /><a
            class="btn btn-danger watch-button"
            href="https://youtu.be/6-Dsfgui0sE?si=DAZWA84ql4s7Zira"
            >Watch Now</a
          >
        </div>
        <div class="video">
          <img src="./src/vid2.png" alt="video 2" /><a
            class="btn btn-danger watch-button"
            href="https://youtu.be/Wh9yXS9sgio?si=0h4l_J8xesm5BCAw"
            >Watch Now</a
          >
        </div>
        <div class="video">
          <img src="./src/vid3.png" alt="video 3" /><a
            class="btn btn-danger watch-button"
            href="https://youtu.be/3OGrCtdnSFA?si=AghfGedOdMN5jvb-"
            >Watch Now</a
          >
        </div>
      </div>
    </div>

  </body>
</html>
